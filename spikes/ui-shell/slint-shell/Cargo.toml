[package]
name = "cv-shell-slint"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cv-ui-model = { path = "../model" }
slint = "1.19"

# Slint's generated code carries #[allow(unsafe_code)], which a crate-level
# `forbid` rejects (E0453). This crate uses `deny` instead; see README.
[lints.rust]
unsafe_code = "deny"
